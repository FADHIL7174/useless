<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Epic Elephant Pop Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for Explosion Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle, #1a1c29 0%, #0d0e15 100%);
            overflow: hidden;
        }
        /* Fireworks Canvas Styling */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }
        /* Shake Animation */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shake-screen {
            animation: shake 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6 text-white select-none">

    <!-- Fireworks Background Canvas -->
    <canvas id="fireworks-canvas"></canvas>

    <!-- Header -->
    <header class="content-layer text-center mt-4">
        <h1 class="text-3xl md:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-yellow-300 to-cyan-400 drop-shadow-lg">
            🐘 PUMP THE ELEPHANT! 🐘
        </h1>
        <p class="text-slate-400 text-sm mt-1">Tap the elephant before its belly pops!</p>
    </header>

    <!-- Main Game Area -->
    <main class="content-layer flex flex-col items-center justify-center my-auto">
        
        <!-- Counter Badge -->
        <div class="mb-6 bg-slate-800/80 border border-slate-700 px-6 py-2 rounded-full backdrop-blur-md shadow-xl">
            <span class="text-slate-400 text-sm">Pressure Level:</span> 
            <span id="click-count" class="text-yellow-400 font-bold text-xl ml-2">0 / 7</span>
        </div>

        <!-- Interactive Elephant Container -->
        <div class="relative cursor-pointer group" onclick="feedElephant()">
            <!-- Elephant Emoji with Dynamic Scaling -->
            <div id="elephant-container" class="text-8xl md:text-9xl transition-transform duration-150 transform hover:scale-105 active:scale-95 drop-shadow-[0_10px_20px_rgba(255,255,255,0.2)]">
                🐘
            </div>
            <!-- Pop Effect Text (Hidden initially) -->
            <div id="pop-alert" class="absolute -top-10 left-1/2 transform -translate-x-1/2 text-pink-500 font-black text-2xl scale-0 transition-transform duration-200 pointer-events-none drop-shadow-md">
                POOP! 💥
            </div>
        </div>

        <!-- Instruction / Status Message -->
        <div class="mt-8 text-center h-10">
            <p id="status-msg" class="text-cyan-300 font-medium text-lg tracking-wide">
                Click the elephant to pump air!
            </p>
        </div>

        <!-- Reset Button (Hidden until burst) -->
        <button id="reset-btn" onclick="resetGame()" class="hidden mt-4 bg-gradient-to-r from-pink-500 to-red-500 hover:from-pink-600 hover:to-red-600 text-white font-bold px-8 py-3 rounded-full shadow-lg transform hover:scale-105 transition duration-200">
            🔄 Resurrect Elephant
        </button>
    </main>

    <!-- Footer -->
    <footer class="content-layer text-slate-500 text-xs text-center">
        Made for Ultimate Fun & Competition 🏆
    </footer>

    <!-- Game Logic Script -->
    <script>
        let clickCount = 0;
        const maxClicks = 7;
        let isExploded = false;

        const elephantContainer = document.getElementById('elephant-container');
        const clickCountDisplay = document.getElementById('click-count');
        const statusMsg = document.getElementById('status-msg');
        const resetBtn = document.getElementById('reset-btn');
        const popAlert = document.getElementById('pop-alert');

        const messages = [
            "Getting slightly bigger...",
            "Whoa, it's eating too much!",
            "Belly is stretching! 🎈",
            "Warning: Critical pressure reached!",
            "Almost ready to burst!!",
            "LAST CHANCE BEFORE BOOM! 🚨"
        ];

        function feedElephant() {
            if (isExploded) return;

            clickCount++;
            clickCountDisplay.innerText = `${clickCount} / ${maxClicks}`;

            // Scale elephant up with each click
            let scaleSize = 1 + (clickCount * 0.12);
            elephantContainer.style.transform = `scale(${scaleSize})`;

            // Pop mini text animation
            popAlert.classList.remove('scale-0');
            popAlert.classList.add('scale-125');
            setTimeout(() => {
                popAlert.classList.remove('scale-125');
                popAlert.classList.add('scale-0');
            }, 150);

            // Update fun messages
            if (clickCount < maxClicks) {
                statusMsg.innerText = messages[clickCount - 1] || "Keep pumping!";
            }

            // Check if max clicks reached (Belly Burst!)
            if (clickCount >= maxClicks) {
                triggerExplosion();
            }
        }

        function triggerExplosion() {
            isExploded = true;
            document.body.classList.add('shake-screen');

            // Change elephant to a broken/funny state (e.g., balloon pop or explosion emoji)
            elephantContainer.innerText = "💥🎈🐘";
            statusMsg.innerText = "OH NO! The elephant's belly burst into pieces! 🤯";
            
            // Hide counter and show reset button
            resetBtn.classList.remove('hidden');

            // Massive Confetti Explosion
            confetti({
                particleCount: 150,
                spread: 100,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                document.body.classList.remove('shake-screen');
            }, 300);
        }

        function resetGame() {
            clickCount = 0;
            isExploded = false;
            clickCountDisplay.innerText = `0 / ${maxClicks}`;
            elephantContainer.innerText = "🐘";
            elephantContainer.style.transform = "scale(1)";
            statusMsg.innerText = "Click the elephant to pump air!";
            resetBtn.classList.add('hidden');
        }

        // --- Background Fireworks Animation ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireworkParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 4 + 1;
                this.friction = 0.95;
                this.gravity = 0.05;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function createFirework() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2);
            const colors = ['#ff0055', '#00f0ff', '#ffcc00', '#7000ff', '#00ff66'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < 30; i++) {
                particles.push(new FireworkParticle(x, y, color));
            }
        }

        function animateFireworks() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((particle, index) => {
                particle.update();
                particle.draw();
                if (particle.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animateFireworks);
        }

        // Launch a new firework every 800ms
        setInterval(createFirework, 800);
        animateFireworks();
    </script>
</body>
</html>
